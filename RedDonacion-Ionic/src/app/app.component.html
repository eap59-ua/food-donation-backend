<ion-app>
  <ion-split-pane contentId="main-content" when="lg">
    <!-- Side menu (only when authenticated) -->
    <ion-menu contentId="main-content" type="overlay" *ngIf="isAuthenticated">
      <ion-content>
        <!-- Header / Brand -->
        <div class="menu-header">
          <div class="menu-logo">
            <ion-icon name="leaf" class="menu-logo-icon"></ion-icon>
            <span class="menu-logo-text">RedDonación</span>
          </div>
          <!-- User info -->
          <div class="menu-user" *ngIf="currentUser">
            <div class="menu-user-avatar">
              {{ currentUser.name?.charAt(0)?.toUpperCase() }}
            </div>
            <div class="menu-user-info">
              <p class="menu-user-name">{{ currentUser.name }}</p>
              <p class="menu-user-role">{{ currentUser.role }}</p>
            </div>
          </div>
        </div>

        <!-- Nav links -->
        <ion-list lines="none" class="menu-list">
          @for (p of appPages; track p.url) {
            <ion-menu-toggle auto-hide="false">
              <ion-item
                routerDirection="root"
                [routerLink]="[p.url]"
                routerLinkActive="menu-item-active"
                detail="false"
                class="menu-item"
              >
                <ion-icon
                  slot="start"
                  [name]="p.icon + '-outline'"
                  class="menu-icon"
                ></ion-icon>
                <ion-label>{{ p.title }}</ion-label>
              </ion-item>
            </ion-menu-toggle>
          }
        </ion-list>

        <!-- Logout at bottom -->
        <div class="menu-footer">
          <ion-item
            button
            detail="false"
            class="menu-item logout-item"
            (click)="logout()"
          >
            <ion-icon
              slot="start"
              name="log-out-outline"
              class="menu-icon"
            ></ion-icon>
            <ion-label>Cerrar sesión</ion-label>
          </ion-item>
        </div>
      </ion-content>
    </ion-menu>

    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
