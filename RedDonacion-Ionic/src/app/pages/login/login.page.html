<ion-content class="login-content" [fullscreen]="true">
  <div class="auth-container">

    <!-- Brand header -->
    <div class="auth-brand">
      <div class="auth-brand-icon">
        <ion-icon name="leaf"></ion-icon>
      </div>
      <h1 class="auth-brand-name">RedDonación</h1>
    </div>

    <!-- Card -->
    <div class="rd-card auth-card">
      <h2 class="auth-title">Acceder</h2>
      <p class="auth-subtitle">Inicia sesión para gestionar tus donaciones</p>

      <!-- Error alert -->
      <div class="rd-alert-error" *ngIf="errorMessage">
        <ion-icon name="alert-circle-outline"></ion-icon>
        <span>{{ errorMessage }}</span>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">

        <!-- Email -->
        <div class="form-group">
          <label class="rd-label">Correo electrónico</label>
          <ion-input
            formControlName="email"
            type="email"
            placeholder="tu@organizacion.org"
            class="rd-input"
            fill="outline"
            [class.ion-invalid]="emailCtrl.invalid && emailCtrl.touched"
            [class.ion-touched]="emailCtrl.touched"
          ></ion-input>
          <p class="rd-error" *ngIf="emailCtrl.invalid && emailCtrl.touched">
            <ion-icon name="alert-circle-outline" style="font-size:12px"></ion-icon>
            <span *ngIf="emailCtrl.errors?.['required']">El correo es obligatorio</span>
            <span *ngIf="emailCtrl.errors?.['email']">Por favor ingresa un correo válido</span>
          </p>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="rd-label">Contraseña</label>
          <div class="password-wrapper">
            <ion-input
              formControlName="password"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="••••••••"
              class="rd-input"
              fill="outline"
              [class.ion-invalid]="passCtrl.invalid && passCtrl.touched"
              [class.ion-touched]="passCtrl.touched"
            >
              <ion-button
                slot="end"
                fill="clear"
                size="small"
                (click)="togglePassword()"
                type="button"
              >
                <ion-icon
                  slot="icon-only"
                  [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
                ></ion-icon>
              </ion-button>
            </ion-input>
          </div>
          <p class="rd-error" *ngIf="passCtrl.invalid && passCtrl.touched">
            <ion-icon name="alert-circle-outline" style="font-size:12px"></ion-icon>
            La contraseña es obligatoria
          </p>
        </div>

        <!-- Submit -->
        <ion-button
          type="submit"
          expand="block"
          class="rd-btn-primary submit-btn"
          [disabled]="isLoading"
        >
          <ion-spinner name="crescent" *ngIf="isLoading" slot="start"></ion-spinner>
          <span *ngIf="!isLoading">Iniciar Sesión</span>
          <span *ngIf="isLoading">Cargando...</span>
          <ion-icon name="arrow-forward-outline" slot="end" *ngIf="!isLoading"></ion-icon>
        </ion-button>
      </form>
    </div>

    <!-- Footer link -->
    <div class="auth-footer">
      <span>¿No tienes cuenta?</span>
      <a routerLink="/register" class="auth-link">Únete ahora</a>
    </div>
  </div>
</ion-content>
