<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Donaciones</ion-title>
    <ion-buttons slot="end" *ngIf="canDonate()">
      <ion-button fill="clear" [routerLink]="['/create-donation']">
        <ion-icon slot="icon-only" name="add-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <!-- Search bar -->
  <ion-toolbar>
    <ion-searchbar
      placeholder="Buscar donaciones..."
      (ionInput)="onSearchChange($event)"
      [debounce]="300"
      class="search-bar"
      animated
    ></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="list-content">
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="list-container">

    <!-- Status filter chips -->
    <div class="filter-chips">
      <button
        *ngFor="let opt of statusOptions"
        class="filter-chip"
        [class.active]="selectedStatus === opt.value"
        (click)="onStatusChange($any(opt.value))"
      >
        {{ opt.label }}
      </button>
    </div>

    <!-- Loading skeletons -->
    <ng-container *ngIf="isLoading">
      <div *ngFor="let i of [1,2,3,4,5]">
        <ion-skeleton-text animated style="height: 90px; border-radius: 14px; margin-bottom: 12px;"></ion-skeleton-text>
      </div>
    </ng-container>

    <!-- Empty state -->
    <div *ngIf="!isLoading && filteredDonations.length === 0" class="rd-empty">
      <ion-icon name="leaf-outline"></ion-icon>
      <h4>Sin donaciones</h4>
      <p>No se encontraron donaciones para los filtros seleccionados.</p>
    </div>

    <!-- Donation cards -->
    <div
      *ngFor="let donation of filteredDonations"
      class="rd-donation-item"
      (click)="goToDetail(donation.id)"
    >
      <div class="donation-header">
        <p class="rd-donation-title">{{ donation.title }}</p>
        <span class="rd-badge {{ getStatusClass(donation.status) }}">
          {{ getStatusLabel(donation.status) }}
        </span>
      </div>
      <p class="donation-desc">{{ donation.description }}</p>
      <div class="rd-donation-meta">
        <ion-icon name="cube-outline"></ion-icon>
        {{ donation.quantity }}
        <span class="meta-sep">·</span>
        <ion-icon name="calendar-outline"></ion-icon>
        <span *ngIf="donation.expiration_date">Cad. {{ formatDate(donation.expiration_date) }}</span>
        <span *ngIf="!donation.expiration_date">Sin fecha</span>
      </div>
    </div>

  </div>
</ion-content>
