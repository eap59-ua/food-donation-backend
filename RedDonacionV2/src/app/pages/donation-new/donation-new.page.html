<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/donations"></ion-back-button>
    </ion-buttons>
    <ion-title>Nueva Donación</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <main class="page-body page-shell soft-hero">
    <form class="form-card wide" (ngSubmit)="submit()">
      <h1>Compartir una Donación</h1>
      <p>Publica excedentes alimentarios para que puedan ser solicitados por organizaciones cercanas.</p>
      <div *ngIf="!canCreate()" class="info-box">Tu rol actual no parece ser DONANTE. El backend solo permite crear donaciones a DONANTE o ADMIN.</div>
      <div class="field">
        <label>Nombre de la donación</label>
        <input class="native-control" name="title" type="text" placeholder="Ej. Lote de frutas" [(ngModel)]="title">
      </div>
      <div class="field">
        <label>Descripción</label>
        <textarea class="native-control" name="description" placeholder="Estado, instrucciones de conservación, horario de recogida..." [(ngModel)]="description"></textarea>
      </div>
      <div class="two-cols">
        <div class="field">
          <label>Cantidad</label>
          <input class="native-control" name="quantity" type="text" placeholder="Ej. 20 kg" [(ngModel)]="quantity">
        </div>
        <div class="field">
          <label>Caducidad</label>
          <input class="native-control" name="expirationDate" type="datetime-local" [(ngModel)]="expirationDate">
        </div>
      </div>
      <div class="field">
        <label>Ubicación de recogida</label>
        <input class="native-control" name="location" type="text" placeholder="Dirección o zona" [(ngModel)]="locationAddress">
      </div>
      <div *ngIf="error" class="error-box">{{ error }}</div>
      <div class="actions end">
        <a class="btn-ghost" routerLink="/tabs/donations">Cancelar</a>
        <button class="btn-primary" type="submit" [disabled]="loading">{{ loading ? 'Publicando...' : 'Compartir donación' }}</button>
      </div>
    </form>
  </main>
</ion-content>
