<ion-header>
  <ion-toolbar color="primary">
    <ion-title>RedDonación — Crear Cuenta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="soft-hero">
  <main class="auth-page page-shell">
    <form class="form-card" (ngSubmit)="submit()">
      <h1>Crear Cuenta</h1>
      <p>Únete a la red solidaria de donación de alimentos</p>

      <div class="field">
        <label>Nombre / Organización</label>
        <input class="native-control" name="name" type="text" placeholder="Tu nombre o entidad" [(ngModel)]="name">
      </div>
      <div class="field">
        <label>Correo Electrónico</label>
        <input class="native-control" name="email" type="email" placeholder="tu@correo.org" [(ngModel)]="email">
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input class="native-control" name="password" type="password" placeholder="Mínimo 6 caracteres" [(ngModel)]="password">
      </div>
      <div class="field">
        <label>Tipo de cuenta</label>
        <select class="native-control" name="role" [(ngModel)]="role">
          <option value="RECEPTOR">Receptor</option>
          <option value="ONG">ONG / Banco de alimentos</option>
          <option value="DONANTE">Donante / Empresa</option>
          <option value="ADMIN">Administrador</option>
        </select>
      </div>

      <div *ngIf="error" class="error-box">{{ error }}</div>
      <div *ngIf="success" class="success-box">{{ success }}</div>

      <button class="btn-primary full" type="submit" [disabled]="loading">
        {{ loading ? 'Creando...' : 'Crear cuenta segura' }}
        <ion-icon name="arrow-forward-outline"></ion-icon>
      </button>
      <p class="switch-text">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
    </form>
  </main>
</ion-content>
