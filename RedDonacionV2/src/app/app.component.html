<ion-app>
  <!-- Menú lateral (Taller 4) -->
  <ion-menu side="start" menuId="principal" contentId="main">
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>RedDonación</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list>
        <ion-item routerLink="/tabs/dashboard" routerDirection="root" (click)="closeMenu()">
          <ion-icon name="grid-outline" slot="start"></ion-icon>
          <ion-label>Dashboard</ion-label>
        </ion-item>
        <ion-item routerLink="/tabs/donations" routerDirection="root" (click)="closeMenu()">
          <ion-icon name="gift-outline" slot="start"></ion-icon>
          <ion-label>Donaciones</ion-label>
        </ion-item>
        <ion-item routerLink="/tabs/requests" routerDirection="root" (click)="closeMenu()">
          <ion-icon name="heart-outline" slot="start"></ion-icon>
          <ion-label>Solicitudes</ion-label>
        </ion-item>
        <ion-item routerLink="/tabs/profile" routerDirection="root" (click)="closeMenu()">
          <ion-icon name="person-outline" slot="start"></ion-icon>
          <ion-label>Mi Perfil</ion-label>
        </ion-item>
        <ion-item button (click)="logout()">
          <ion-icon name="log-out-outline" slot="start" color="danger"></ion-icon>
          <ion-label color="danger">Cerrar Sesión</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main"></ion-router-outlet>
</ion-app>
